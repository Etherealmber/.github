name: Refresh profile stats

# Keeps profile/README.md current with zero manual edits:
#   - versions come from each repo's latest release / package.json
#   - commit, PR, release and issue counts come from the GitHub API
#   - progress bars are drawn from profile/progress.json
#
# Runs daily, on demand, and whenever the generator itself changes.
# Versions are also shown as live shields.io badges, so they stay correct
# between runs.

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile/progress.json'
      - 'scripts/update-profile.mjs'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate profile blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- profile/README.md; then
            echo "Profile already up to date."
            exit 0
          fi
          git add profile/README.md
          git commit -m "chore(profile): refresh stats, versions and progress bars"
          git push
